[package]
name = "lokode"
version = "0.5.1"
edition = "2021"
description = "Experimental local-first coding agent in the terminal, driven by a model on your own machine"
repository = "https://github.com/loken-ai/lokode"
license = "MIT OR Apache-2.0"
keywords = ["agent", "tui", "coding"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.92"

[lib]
name = "lokode"
path = "src/lib.rs"

[[bin]]
name = "lokode"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
# Edits a project file without losing its comments or its order.
toml_edit = "0.22"
futures = "0.3"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"

# Terminal
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9"
# The markdown a model writes, read for the pane
pulldown-cmark = { version = "0.13", default-features = false }
# Code coloured by TextMate grammar, in pure Rust: the bundled grammars only
syntaxmate = { version = "0.2", default-features = false, features = ["bundled-grammars"] }
# Asks the terminal what its text and background colours are, for the tints
terminal-colorsaurus = "1"

# Server-sent events
eventsource-stream = "0.2"

# Tool arguments, and repairing the ones a model gets slightly wrong
json5 = "0.4"
jsonschema = { version = "0.30", default-features = false }

# Diff and patch
similar = "2"
diffy = "0.4"

# Filesystem traversal that honours ignore files, and the search that falls back on it
ignore = "0.4"
regex = "1"

uuid = { version = "1", features = ["v4"] }
# A plugin offered as a zip archive
zip = { version = "9", default-features = false, features = ["deflate"] }
# Language server client: types only, the stdio JSON-RPC client is in-crate.
# Pinned to 0.94, which still re-exports `Url`; 0.95 swapped it for `Uri`.
lsp-types = "0.94"
url = { version = "2", features = ["serde"] }
# Signing in to a tool server: the secret a sign-in is bound to, and its hash
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
# The sound that tells an action has finished
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis", "mp4"], optional = true }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
blake2 = "0.10.6"
hmac = "0.12"
socket2 = { version = "0.6", features = ["all"] }

# Landlock on Linux, whose syscalls are made directly so that what runs between fork and exec
# is exactly two of them, and the signals that stop a hook's processes on any Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

lopdf = { version = "0.47.0", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"

[features]
default = ["sound"]
# Sounds for the end of a turn. Without it the build needs no audio library.
sound = ["dep:rodio"]
