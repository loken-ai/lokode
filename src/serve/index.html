<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lokode</title>
<link rel="stylesheet" href="/page.css">
</head>
<body>
<header class="band">
  <b>lokode</b>
  <span id="project"></span>
  <span id="session" class="dim"></span>
  <span class="grow"></span>
  <span id="link" class="dim">connecting</span>
</header>
<main>
  <section class="thread-col">
    <div id="thread" class="thread" aria-live="polite"></div>
    <form id="ask" class="ask">
      <div id="commands" class="commands" hidden></div>
      <textarea id="input" rows="2" placeholder="ask for something   / commands   @ files" autocomplete="off"></textarea>
      <div class="ask-row">
        <span id="status" class="dim"></span>
        <span class="grow"></span>
        <button type="button" id="stop" hidden>Stop</button>
        <button type="submit" id="send">Send</button>
      </div>
    </form>
  </section>
  <aside class="rail">
    <div class="block">
      <h4>MODE</h4>
      <select id="mode" aria-label="Mode"></select>
    </div>
    <div class="block">
      <h4>PLAN</h4>
      <ul id="plan" class="plan"><li class="dim">no task list yet</li></ul>
    </div>
    <div class="block">
      <h4>CHANGES</h4>
      <ul id="changes" class="plain"><li class="dim">nothing changed yet</li></ul>
    </div>
    <div class="block">
      <h4>WINDOW</h4>
      <div class="bar"><i id="window-bar"></i></div>
      <span id="window" class="dim">not measured yet</span>
    </div>
    <div class="block">
      <h4>ENGINE</h4>
      <span id="engine" class="dim">not measured yet</span>
    </div>
    <div class="block">
      <h4>SESSIONS</h4>
      <button type="button" id="new-session">New session</button>
      <ul id="sessions" class="plain sessions"></ul>
    </div>
  </aside>
</main>
<script src="/page.js"></script>
</body>
</html>
